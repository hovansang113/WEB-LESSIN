<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEESIN | Fashion Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../CSS/viet.css" />
</head>

<body>
    <header class="navbar">
        <!-- Hamburger icon SVG -->
        <div class="hamburger" id="hamburger">
            <!-- icon dạng SVG để luôn hiển thị -->
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
        <path
          d="M3 6h18M3 12h18M3 18h18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          
        />
        <!-- stroke dùng để tô màu viền
        stroke-width dùng để điều chỉnh độ dày của viền -->
      </svg>
        </div>

        <!-- Logo giữa -->
        <div class="logo">
            <a href="# ">LEESIN</a>
        </div>

        <!-- Tìm kiếm + icon -->
        <div class="nav-actions">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm sản phẩm..." />
                <button>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
            viewBox="0 0 24 24 ">
            <path
              d="M21 21l-4.35-4.35M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16z "
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
            </div>
            <a href="#" class="icon">
        🛒
      </a>
            <a href="#" class="icon">
        👤
      </a>
        </div>
    </header>

    <!-- MENU ẨN -->
    <nav class="side-menu" id="side-menu">
        <a href="# ">Home</a>
        <a href="# ">Product</a>
        <a href="# ">About</a>
        <a href="# ">Contact</a>
    </nav>

    <!-- LỚP PHỦ -->
    <div class="overlay" id="overlay"></div>

    <div style="height:2000px; background:#fafafa; "></div>


    <script>
        const hamburger = document.getElementById("hamburger");
        const sideMenu = document.getElementById("side-menu");
        const overlay = document.getElementById("overlay");
        // Lấy các phần tử cần thiết

        hamburger.addEventListener("click", () => {
            sideMenu.classList.toggle("active");
            overlay.classList.toggle("active");
            // Toggle lớp active để hiển thị menu và overlay để che phần còn lại
        });

        overlay.addEventListener("click", () => {
            sideMenu.classList.remove("active");
            overlay.classList.remove("active");
            x
            // Ẩn menu và overlay khi nhấp vào overlay
        });
    </script>
</body>

</html>
